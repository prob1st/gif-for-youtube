<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF for YouTube</title>
<style>
  :root{
    --accent:#ff2d55;--bg:#131317;--bg2:#1b1b21;--bg3:#24242c;--line:#2e2e38;
    --fg:#f4f4f7;--mut:#9a9aa8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;width:328px;background:var(--bg);color:var(--fg);
    font-family:"YouTube Sans",Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    font-size:13px;-webkit-font-smoothing:antialiased;
  }
  header{
    display:flex;align-items:center;gap:10px;padding:14px 14px 12px;
    background:linear-gradient(135deg,#ff2d55 0%,#ff6b3d 55%,#ff2d55 100%);
    position:relative;overflow:hidden;
  }
  header::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120px 80px at 85% -20%,rgba(255,255,255,.35),transparent 70%);
  }
  .logo{
    width:34px;height:34px;border-radius:11px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.24);
    display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:-.4px;color:#fff;flex:0 0 auto;
    backdrop-filter:blur(3px);z-index:1;
  }
  .h-title{font-weight:800;font-size:14px;letter-spacing:-.2px;line-height:1.15;z-index:1;color:#fff}
  .h-sub{font-size:10.5px;color:rgba(255,255,255,.82);margin-top:2px;z-index:1}
  main{padding:12px}
  .status{
    display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);
    background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:10px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#ef4444;flex:0 0 auto}
  .dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  button{font-family:inherit}
  .btn{
    width:100%;border:1px solid var(--line);background:var(--bg3);color:var(--fg);
    border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:650;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    transition:filter .14s,transform .1s,background .14s;margin-bottom:8px;
  }
  .btn:hover{background:#2d2d37}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{
    background:var(--accent);border-color:transparent;color:#fff;
    box-shadow:0 8px 22px -10px var(--accent);
  }
  .btn.primary:hover{filter:brightness(1.07)}
  .btn svg{width:15px;height:15px;flex:0 0 auto}
  kbd{
    font:650 10px/1.6 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:0 5px;
  }
  .btn:not(.primary) kbd{background:#15151a;border-color:#33333f;color:var(--mut)}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
  .sec b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
  .sec a{font-size:11px;color:var(--accent);text-decoration:none;font-weight:650}
  .sec a:hover{text-decoration:underline}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .thumb{
    position:relative;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--bg3);
    cursor:pointer;aspect-ratio:1;border:1px solid var(--line);
    transition:transform .14s,border-color .14s;
  }
  .thumb:hover{transform:translateY(-2px);border-color:var(--accent)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .empty{font-size:11.5px;color:var(--mut);line-height:1.55;padding:12px;border:1px dashed var(--line);border-radius:10px;text-align:center}
  footer{border-top:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
  .stats{font-size:10.5px;color:var(--mut)}
  .link{background:none;border:0;color:var(--mut);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px}
  .link:hover{color:var(--fg);background:var(--bg3)}
  .tip{font-size:10.5px;color:var(--mut);line-height:1.5;margin:0 0 10px}
  .tip b{color:var(--fg)}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#33333f;border-radius:8px}
</style>
</head>
<body>
  <header>
    <div class="logo">GIF</div>
    <div>
      <div class="h-title">GIF for YouTube</div>
      <div class="h-sub"><span id="packCount">335</span> hazır GIF · Giphy arama</div>
    </div>
  </header>

  <main>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Sayfa kontrol ediliyor…</span></div>

    <button class="btn primary" id="openPanel">
      <span>Paneli aç</span><kbd>Ctrl+Shift+G</kbd>
    </button>
    <button class="btn" id="quickInsert">
      <span>Son GIF'i yoruma ekle</span><kbd>Ctrl+Shift+Y</kbd>
    </button>

    <p class="tip">İpucu: yorum kutusuna tıklayıp <b>paneli aç</b>, GIF'e tıkla → <b>Yoruma ekle</b>. GIF'i doğrudan yorum alanına da sürükleyebilirsin.</p>

    <div class="sec">
      <b>Son kullanılanlar</b>
      <a href="#" id="openSettings">Ayarlar →</a>
    </div>
    <div class="grid" id="recents"></div>
    <div class="empty" id="recentEmpty" hidden>Henüz GIF eklemedin. Paneli aç ve ilk GIF'ini seç.</div>
  </main>

  <footer>
    <span class="stats" id="stats">—</span>
    <button class="link" id="help">Yardım &amp; kısayollar</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
